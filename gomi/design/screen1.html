<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面1 品目を選ぶ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1d6a4c}a:hover{color:#18221d}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; background: #ffffff; color: #18221d; font-family: 'BIZ UDPGothic', sans-serif; line-height: 1.7; font-size: 16px; display: flex; flex-direction: column; gap: 8px">
  <p style="margin: 0; font-size: 14px; color: #4c5952">ステップ 1 / 4</p>
  <h1 style="margin: 0 0 8px; font-size: 22px">出したいものを選ぶ</h1>
  <p style="margin: 0; font-weight: 700">品目（選ぶと手数料が分かります）</p>
  <label style="display: flex; gap: 10px; align-items: center; padding: 12px; border: 2px solid #1d6a4c; border-radius: 8px; background: #dcebe2"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #1d6a4c"> ソファ（1人掛け）800円</label>
  <label style="display: flex; gap: 10px; align-items: center; padding: 12px; border: 2px solid #c3cdc6; border-radius: 8px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #1d6a4c"> 自転車 400円</label>
  <label style="display: flex; gap: 10px; align-items: center; padding: 12px; border: 2px solid #c3cdc6; border-radius: 8px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #1d6a4c"> 布団 400円</label>
  <label style="display: flex; gap: 10px; align-items: center; padding: 12px; border: 2px solid #1d6a4c; border-radius: 8px; background: #dcebe2"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #1d6a4c"> 学習机 1,200円</label>
  <p style="margin: 8px 0 0; font-size: 18px; font-weight: 700">手数料の合計 2,000円</p>
  <button style="width: 100%; min-height: 48px; font-family: inherit; font-size: 16px; font-weight: 700; border: 2px solid #1d6a4c; border-radius: 8px; background: #1d6a4c; color: #ffffff">収集日を選ぶ</button>
</div>
</body>
</html>
