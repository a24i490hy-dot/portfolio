<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面3 エラーのとき</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1d6a4c}a:hover{color:#18221d}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; background: #ffffff; color: #18221d; font-family: 'BIZ UDPGothic', sans-serif; line-height: 1.7; font-size: 16px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; flex-direction: column; gap: 0">
    <p style="margin: 0; font-size: 14px; color: #4c5952">ステップ 3 / 4</p>
    <h1 style="margin: 0; font-size: 22px">申込者の情報を入力</h1>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <label for="e-name" style="font-weight: 700">氏名（必須）</label>
    <input type="text" id="e-name" style="width: 100%; box-sizing: border-box; padding: 10px; font-family: inherit; font-size: 16px; border: 2px solid #b42318; border-radius: 8px; background: #fbe9e7; color: #18221d">
    <p style="margin: 0; color: #b42318; font-weight: 700">氏名を入力してください</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <label for="e-tel" style="font-weight: 700">電話番号（必須・ハイフンはあってもなくても可）</label>
    <input type="tel" id="e-tel" value="090-1234" style="width: 100%; box-sizing: border-box; padding: 10px; font-family: inherit; font-size: 16px; border: 2px solid #b42318; border-radius: 8px; background: #fbe9e7; color: #18221d">
    <p style="margin: 0; color: #b42318; font-weight: 700">電話番号は0から始まる10桁か11桁で入力してください</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px">
    <button style="width: 100%; min-height: 48px; font-family: inherit; font-size: 16px; font-weight: 700; border: 2px solid #1d6a4c; border-radius: 8px; background: #1d6a4c; color: #ffffff">確認画面へ</button>
    <button style="width: 100%; min-height: 48px; font-family: inherit; font-size: 16px; font-weight: 700; border: 2px solid #1d6a4c; border-radius: 8px; background: #ffffff; color: #1d6a4c">戻る</button>
  </div>
</div>
</body>
</html>
