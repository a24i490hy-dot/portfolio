<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画面2 収集日を選ぶ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1d6a4c}a:hover{color:#18221d}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px; background: #ffffff; color: #18221d; font-family: 'BIZ UDPGothic', sans-serif; line-height: 1.7; font-size: 16px; display: flex; flex-direction: column; gap: 8px">
  <p style="margin: 0; font-size: 14px; color: #4c5952">ステップ 2 / 4</p>
  <h1 style="margin: 0 0 8px; font-size: 22px">収集日を選ぶ</h1>
  <p style="margin: 0; font-weight: 700">収集日（申し込みは3日前の17時まで）</p>
  <label style="display: flex; gap: 10px; align-items: center; padding: 12px; border: 2px solid #1d6a4c; border-radius: 8px; background: #dcebe2"><input type="radio" name="date" checked style="width: 20px; height: 20px; margin: 0; accent-color: #1d6a4c"> 11月4日（水）</label>
  <label style="display: flex; gap: 10px; align-items: center; padding: 12px; border: 2px dashed #c3cdc6; border-radius: 8px; color: #4c5952"><input type="radio" name="date" disabled style="width: 20px; height: 20px; margin: 0"> 11月11日（水）受付終了（満）</label>
  <label style="display: flex; gap: 10px; align-items: center; padding: 12px; border: 2px solid #c3cdc6; border-radius: 8px"><input type="radio" name="date" style="width: 20px; height: 20px; margin: 0; accent-color: #1d6a4c"> 11月18日（水）</label>
  <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px">
    <button style="width: 100%; min-height: 48px; font-family: inherit; font-size: 16px; font-weight: 700; border: 2px solid #1d6a4c; border-radius: 8px; background: #1d6a4c; color: #ffffff">申込者の入力へ</button>
    <button style="width: 100%; min-height: 48px; font-family: inherit; font-size: 16px; font-weight: 700; border: 2px solid #1d6a4c; border-radius: 8px; background: #ffffff; color: #1d6a4c">戻る</button>
  </div>
</div>
</body>
</html>
